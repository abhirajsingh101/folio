name: Publish

# Trusted Publishing (OIDC) — no API token exists to leak, rotate or forget.
# PyPI verifies the request came from this repo, this workflow, this
# environment, and mints a credential valid for one upload.
#
#   push a v* tag        → build, verify, publish to PyPI
#   dispatch (testpypi)  → same build, published to TestPyPI instead
#
# Dispatching against a tag ref publishes exactly what that tag holds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# Nothing here needs repository scopes. The publish jobs request the OIDC
# token themselves, so the build job runs with no permissions at all.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install build twine

      # A version is declared in two files and read by two audiences; the tag
      # is a third. PyPI rejects nothing here — it would happily publish 0.2.0
      # from a tag called v0.3.0, and the mismatch is permanent.
      - name: the tag must name the version it ships
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} ships version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${version}"

      - run: python -m build
      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
