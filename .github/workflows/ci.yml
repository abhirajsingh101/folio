name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # folio must stay usable when WeasyPrint's native libraries are absent.
  # This job installs nothing but Python and proves the package still imports,
  # the doctor still reports, and the tests that do not need a renderer pass.
  no-native-libs:
    name: no native libs (degraded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # The documented fallback: playwright bundles its own browser and needs
      # no system libraries, so folio must still render here.
      - run: pip install playwright && playwright install --with-deps chromium
      - name: doctor reports rather than crashes
        run: python -m folio doctor || true
      - run: pytest -q

  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }

      - name: Native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libcairo2 libgdk-pixbuf-2.0-0 poppler-utils

      - name: Native libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo gdk-pixbuf poppler
          # Homebrew's lib dir is not on the default dyld search path, so
          # WeasyPrint's ctypes lookup fails without this. Same fix folio
          # doctor prints for users.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # Windows deliberately gets no native libraries. folio must fall back to
      # playwright's bundled browser and still produce a PDF.
      - name: Install
        run: pip install -e ".[dev,charts]"

      - name: Install WeasyPrint (non-Windows)
        if: runner.os != 'Windows'
        run: pip install weasyprint

      - name: Install the fallback renderer
        run: pip install playwright && playwright install chromium

      - name: Doctor
        run: python -m folio doctor
        continue-on-error: true

      # Regression: CJK and status marks could not be printed on a cp1252
      # console, so folio could not report on a non-Latin document at all.
      - name: Non-Latin output survives the console encoding
        shell: bash
        run: |
          printf '<p>\u3053\u308c\u306f\u65e5\u672c\u8a9e\u306e\u6587\u66f8\u3067\u3059\u3002</p>' > /tmp/ja.html
          python -m folio fonts /tmp/ja.html || true

      - name: Tests
        run: pytest -q

      - name: End-to-end scaffold build
        shell: bash
        run: |
          mkdir -p /tmp/folio-e2e && cd /tmp/folio-e2e
          python -m folio init
          python -m folio build document.html
          test -f document.pdf || { echo "no PDF produced"; exit 1; }
          head -c 4 document.pdf | grep -q '%PDF' || { echo "not a PDF"; exit 1; }

      # The scaffold every user starts from must pass folio's own quality gate.
      - name: Scaffold passes the quality gate
        if: runner.os != 'Windows'
        shell: bash
        run: cd /tmp/folio-e2e && python -m folio check document.html

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
